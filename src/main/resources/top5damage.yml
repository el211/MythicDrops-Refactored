# Configuration for mobs that use top-5 damage ranking rewards
# Rankings are based on tracked combat damage, so no MythicMobs threat table is required.

rewardtop5:
  - SkeletonKing  # This mob will use the top-5 reward system on death

rewardtop5-settings:
  use-flexible-rewards: false # true = all rewards are tried by chance
  # false = legacy mode (stop after guaranteed)


SkeletonKing:
  use-standard-rewards: false        # Do not use config.yml rewards for this mob
  guaranteedperrank: true            # If true, each rank below can define its own guaranteed-rewards
  per-rank-group: true               # If true, guaranteed-rewards can be a group section instead of a single number
  guaranteed-rewards:               # Global fallback by group if a rank does not override guaranteed-rewards
    default: 1
    vip: 2
    legend: 3

  first-place:                       # Rewards for top damager
    guaranteed-rewards: 1            # Used if guaranteedperrank is true; may also be a group section when per-rank-group is true
    default:
      drop1:
        command: "give %player% diamond 5"
        chance: 1.0
        message: "&aYou are the top damager! Enjoy your diamonds!"
    vip:
      drop1:
        command: "give %player% nether_star 1"
        chance: 1.0
        message: "&bVIP Bonus: Nether Star for being the top damager!"

  second-place:
    guaranteed-rewards: 1
    default:
      drop1:
        command: "give %player% emerald 10"
        chance: 0.8
        message: "&aSecond place! Here's 10 emeralds."

  third-place:
    guaranteed-rewards: 1
    default:
      drop1:
        command: "give %player% gold_ingot 15"
        chance: 0.6
        message: "&aThird place! Here's some gold."

  fourth-place:
    guaranteed-rewards: 1
    default:
      drop1:
        command: "give %player% iron_ingot 20"
        chance: 0.5
        message: "&aFourth place! Enjoy your iron!"

  fifth-place:
    guaranteed-rewards: 1
    default:
      drop1:
        command: "give %player% coal 32"
        chance: 0.4
        message: "&aFifth place! Here are some resources."

  everyone-else-who-contributed:     # Players outside top-5, but contributed enough damage
    min-damage: 50.0                 # Minimum damage threshold to qualify
    default:
      drop1:
        command: "give %player% stone 64"
        chance: 0.5
        message: "&aThanks for contributing! Here's some stone."
      drop2:
        command: "give %player% apple 5"
        chance: 0.3
        message: "&cYou got apples as a consolation prize!"
