# Configuration for mobs that use top-3 damage rewards
# Rankings are based on tracked combat damage, so no MythicMobs threat table is required.

rewardtop3:
  - SkeletalKnight  # List of mobs using top-3 reward logic
rewardtop3-settings:
  use-flexible-rewards: true  # true = all rewards are tried by chance
                                # false = legacy mode (stop after guaranteed)


SkeletalKnight:
  use-standard-rewards: false        # Skip normal config.yml drops for this mob
  guaranteedperrank: true            # Enables guaranteed-rewards under each rank section
  per-rank-group: true               # Lets guaranteed-rewards use group-based values when that key is a section
  guaranteed-rewards:               # Fallback values by permission group if a rank does not override guaranteed-rewards
    default: 1
    vip: 2
    legend: 3

  first-place:                       # Player with highest damage dealt
    guaranteed-rewards: 1            # Used if guaranteedperrank: true; may also be a group section when per-rank-group is true
    default:
      drop1:
        command: "give %player% diamond 3"
        chance: 1
        message: "&b&lFirst Place! You got 3 diamonds from the Skeleton King!"
    vip:
      drop1:
        command: "give %player% diamond 5"
        chance: 0.9
        message: "&b&lVIP First Place! You got 5 diamonds from the Skeleton King!"

  second-place:                      # Player with second highest damage
    guaranteed-rewards: 1
    default:
      drop1:
        command: "give %player% diamond 2"
        chance: 0.6
        message: "&e&lSecond Place! You got 2 diamonds from the Skeleton King!"
    vip:
      drop1:
        command: "give %player% diamond 3"
        chance: 0.7
        message: "&e&lVIP Second Place! You got 3 diamonds from the Skeleton King!"

  third-place:                       # Player with third highest damage
    guaranteed-rewards: 1
    default:
      drop1:
        command: "give %player% diamond 1"
        chance: 0.5
        message: "&c&lThird Place! You got 1 diamond from the Skeleton King!"
    vip:
      drop1:
        command: "give %player% diamond 2"
        chance: 0.6
        message: "&c&lVIP Third Place! You got 2 diamonds from the Skeleton King!"

  everyone-else-who-contributed:     # Players outside top-3 but dealt enough damage
    min-damage: 50.0                 # Must deal this much to qualify
    default:
      drop1:
        command: "give %player% emerald 1"
        chance: 0.8
        message: "&aThanks for contributing! Here's 1 emerald."
